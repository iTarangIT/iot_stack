<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itarang IoT Stack — Status</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f242c;
    --border: #2a313c;
    --text: #d8dee9;
    --muted: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .meta .err { color: var(--red); }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 32px; }
  section h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card .row1 { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .card .name { font-family: var(--mono); font-size: 13px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--mono);
    text-transform: lowercase;
    border: 1px solid transparent;
  }
  .pill.ok      { background: rgba(63,185,80,0.12);  color: var(--green);  border-color: rgba(63,185,80,0.4); }
  .pill.warn    { background: rgba(210,153,34,0.12); color: var(--yellow); border-color: rgba(210,153,34,0.4); }
  .pill.bad     { background: rgba(248,81,73,0.12);  color: var(--red);    border-color: rgba(248,81,73,0.4); }
  .pill.muted   { background: var(--panel-2);        color: var(--muted);  border-color: var(--border); }
  .card .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .card pre {
    margin: 0;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.45;
    max-height: 160px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .health-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
  .health-card .label { font-family: var(--mono); font-size: 13px; margin-bottom: 6px; }
  .health-card .detail { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; }
  td.muted { color: var(--muted); }
  .host-line { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) { .health-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <h1>Itarang IoT Stack — Status</h1>
    <div class="meta">
      <span id="updated">loading…</span>
      <span id="err" class="err"></span>
    </div>
  </header>
  <main>
    <section>
      <h2>Containers</h2>
      <div id="containers" class="grid"></div>
    </section>
    <section>
      <h2>Health checks</h2>
      <div id="health" class="health-grid"></div>
    </section>
    <section>
      <h2>Postgres data freshness</h2>
      <table id="freshness">
        <thead><tr><th>Table</th><th class="num">Rows</th><th>Last update</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Host</h2>
      <div id="host" class="host-line">—</div>
    </section>
  </main>

<script>
const REFRESH_MS = 5000;

function relUptime(iso) {
  if (!iso || iso.startsWith("0001-")) return "—";
  const start = new Date(iso).getTime();
  if (!start) return "—";
  let s = Math.max(0, Math.floor((Date.now() - start) / 1000));
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600);  s %= 3600;
  const m = Math.floor(s / 60);    s %= 60;
  if (d) return `${d}d${h}h`;
  if (h) return `${h}h${m}m`;
  if (m) return `${m}m${s}s`;
  return `${s}s`;
}

function pillClass(state, restarts) {
  if (state === "running") return restarts > 5 ? "warn" : "ok";
  if (state === "restarting" || state === "created" || state === "paused") return "warn";
  if (state === "missing" || state === "exited" || state === "dead") return "bad";
  return "muted";
}

function renderContainers(list) {
  const el = document.getElementById("containers");
  el.innerHTML = list.map(c => `
    <div class="card">
      <div class="row1">
        <span class="name">${c.name}</span>
        <span class="pill ${pillClass(c.state, c.restart_count)}">${c.state}</span>
      </div>
      <div class="meta">uptime ${relUptime(c.started_at)} · restarts ${c.restart_count} · ${c.status}</div>
      <pre>${(c.logs || "(no logs)").replace(/[<&]/g, m => ({"<":"&lt;","&":"&amp;"}[m]))}</pre>
    </div>
  `).join("");
}

function renderHealth(h) {
  const el = document.getElementById("health");
  const card = (label, res) => `
    <div class="health-card">
      <div class="row1">
        <span class="label">${label}</span>
        <span class="pill ${res.ok ? "ok" : "bad"}">${res.ok ? "ok" : "fail"}</span>
      </div>
      <div class="detail">${(res.detail || "").slice(0, 200)}</div>
    </div>
  `;
  el.innerHTML = card("postgres", h.postgres) + card("redis", h.redis) + card("risk-sandbox", h.risk_sandbox);
}

function renderFreshness(rows) {
  const tbody = document.querySelector("#freshness tbody");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.name}</td>
      <td class="num">${r.rows.toLocaleString()}</td>
      <td class="muted">${r.last || "never"}</td>
    </tr>
  `).join("");
}

function renderHost(h) {
  document.getElementById("host").textContent =
    `${h.hostname} · disk ${h.disk_used_gb}/${h.disk_total_gb} GB (${h.disk_pct}%) · ` +
    `mem ${h.mem_used_mb}/${h.mem_total_mb} MB · load ${h.load.join(" ")}`;
}

async function tick() {
  const errEl = document.getElementById("err");
  try {
    const r = await fetch("/api/status", { credentials: "same-origin", cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    renderContainers(data.containers);
    renderHealth(data.health);
    renderFreshness(data.freshness);
    renderHost(data.host);
    document.getElementById("updated").textContent =
      "updated " + new Date(data.generated_at).toLocaleTimeString();
    errEl.textContent = "";
  } catch (e) {
    errEl.textContent = " · fetch failed: " + e.message;
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itarang IoT Stack — Status</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f242c;
    --border: #2a313c;
    --text: #d8dee9;
    --muted: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .meta .err { color: var(--red); }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 32px; }
  section h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card .row1 { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .card .name { font-family: var(--mono); font-size: 13px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--mono);
    text-transform: lowercase;
    border: 1px solid transparent;
  }
  .pill.ok      { background: rgba(63,185,80,0.12);  color: var(--green);  border-color: rgba(63,185,80,0.4); }
  .pill.warn    { background: rgba(210,153,34,0.12); color: var(--yellow); border-color: rgba(210,153,34,0.4); }
  .pill.bad     { background: rgba(248,81,73,0.12);  color: var(--red);    border-color: rgba(248,81,73,0.4); }
  .pill.muted   { background: var(--panel-2);        color: var(--muted);  border-color: var(--border); }
  .card .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .card pre {
    margin: 0;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.45;
    max-height: 160px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .health-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
  .health-card .label { font-family: var(--mono); font-size: 13px; margin-bottom: 6px; }
  .health-card .detail { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; }
  td.muted { color: var(--muted); }
  td.stale { color: var(--yellow); }
  td.bad   { color: var(--red); }
  .tag {
    display: inline-block;
    padding: 1px 6px;
    margin: 1px 4px 1px 0;
    border-radius: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text);
  }
  .endpoint-name { color: var(--blue); }
  .host-line { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  /* ── architecture diagram ── */
  .arch-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
  }
  .arch svg { display: block; max-width: 100%; height: auto; }
  .arch .node rect {
    fill: var(--panel-2);
    stroke: var(--border);
    stroke-width: 1.5;
    transition: fill 0.3s, stroke 0.3s;
  }
  .arch .node text {
    fill: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
  .arch .node .sub {
    fill: var(--muted);
    font-size: 10px;
  }
  .arch .node.ok rect    { fill: rgba(63,185,80,0.14);  stroke: var(--green); }
  .arch .node.bad rect   { fill: rgba(248,81,73,0.14);  stroke: var(--red); }
  .arch .node.warn rect  { fill: rgba(210,153,34,0.14); stroke: var(--yellow); }
  .arch .ext rect {
    fill: transparent;
    stroke: var(--border);
    stroke-dasharray: 4 3;
  }
  .arch .ext text { fill: var(--muted); font-style: italic; }
  .arch .edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
  .arch .edge-label { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
  .arch-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .arch-legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; border: 1px solid var(--border); }
  .arch-legend .ok    { background: rgba(63,185,80,0.4); border-color: var(--green); }
  .arch-legend .bad   { background: rgba(248,81,73,0.4); border-color: var(--red); }
  .arch-legend .warn  { background: rgba(210,153,34,0.4); border-color: var(--yellow); }
  .arch-legend .idle  { background: var(--panel-2); }
  @media (max-width: 700px) { .health-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <h1>Itarang IoT Stack — Status</h1>
    <div class="meta">
      <span id="updated">loading…</span>
      <span id="err" class="err"></span>
    </div>
  </header>
  <main>
    <section>
      <h2>Architecture</h2>
      <div class="arch-wrap">
        <div class="arch">
          <svg viewBox="0 0 920 460" role="img" aria-label="System architecture">
            <!-- arrow marker -->
            <defs>
              <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"></path>
              </marker>
            </defs>

            <!-- external sources (top row) -->
            <g class="ext" id="ext-intellicar">
              <rect x="40" y="10" width="280" height="92" rx="4"></rect>
              <text x="180" y="30">Intellicar API</text>
              <text x="180" y="46" class="sub" style="fill:var(--muted);font-size:10px">apiplatform.intellicar.in/api/standard</text>
              <text x="180" y="64" class="sub" style="fill:var(--muted);font-size:10px">30s loop · getlastgpsstatus, getlatestcan</text>
              <text x="180" y="78" class="sub" style="fill:var(--muted);font-size:10px">daily 01:05 UTC · 6 history endpoints</text>
              <text x="180" y="92" class="sub" style="fill:var(--muted);font-size:10px">hourly · listvehicles, listusers, …</text>
            </g>
            <g class="ext">
              <rect x="640" y="20" width="200" height="44" rx="4"></rect>
              <text x="740" y="42">AWS RDS (NBFC)</text>
              <text x="740" y="56" class="sub" style="fill:var(--muted);font-size:10px">read-only loans/borrowers</text>
            </g>

            <!-- ingest row -->
            <g id="node-poller" class="node">
              <rect x="100" y="120" width="160" height="56" rx="6"></rect>
              <text x="180" y="142">poller</text>
              <text x="180" y="160" class="sub">Python · ingest</text>
            </g>
            <g id="node-aggregator" class="node">
              <rect x="660" y="120" width="160" height="56" rx="6"></rect>
              <text x="740" y="142">aggregator</text>
              <text x="740" y="160" class="sub">cron · joins → dashboard_*</text>
            </g>

            <!-- data layer -->
            <g id="node-postgres" class="node">
              <rect x="240" y="220" width="240" height="62" rx="6"></rect>
              <text x="360" y="244">postgres</text>
              <text x="360" y="262" class="sub">TimescaleDB · raw + dashboard_*</text>
            </g>
            <g id="node-redis" class="node">
              <rect x="520" y="220" width="160" height="62" rx="6"></rect>
              <text x="600" y="244">redis</text>
              <text x="600" y="262" class="sub">poller hot-state cache</text>
            </g>

            <!-- consumers row -->
            <g id="node-risk_sandbox" class="node">
              <rect x="100" y="340" width="200" height="56" rx="6"></rect>
              <text x="200" y="362">risk-sandbox</text>
              <text x="200" y="380" class="sub">FastAPI · LangGraph runs</text>
            </g>
            <g id="node-monitor" class="node">
              <rect x="380" y="340" width="180" height="56" rx="6"></rect>
              <text x="470" y="362">monitor</text>
              <text x="470" y="380" class="sub">this page</text>
            </g>
            <g class="ext">
              <rect x="620" y="340" width="220" height="56" rx="6"></rect>
              <text x="730" y="362">Next.js CRM</text>
              <text x="730" y="380" class="sub" style="fill:var(--muted);font-size:10px">reads dashboard_* via bridge</text>
            </g>

            <!-- edges -->
            <!-- Intellicar → poller -->
            <path class="edge" d="M180,102 L180,120" marker-end="url(#arr)"></path>
            <!-- AWS RDS → aggregator -->
            <path class="edge" d="M740,64 L740,120" marker-end="url(#arr)"></path>
            <!-- poller → postgres -->
            <path class="edge" d="M200,176 C200,200 280,200 300,220" marker-end="url(#arr)"></path>
            <!-- poller → redis -->
            <path class="edge" d="M240,176 C300,180 540,200 560,220" marker-end="url(#arr)"></path>
            <!-- aggregator → postgres -->
            <path class="edge" d="M720,176 C700,200 460,210 440,220" marker-end="url(#arr)"></path>
            <!-- postgres → risk-sandbox -->
            <path class="edge" d="M320,282 C300,310 220,320 200,340" marker-end="url(#arr)"></path>
            <!-- postgres → monitor -->
            <path class="edge" d="M380,282 C400,310 460,320 470,340" marker-end="url(#arr)"></path>
            <!-- redis → monitor -->
            <path class="edge" d="M580,282 C540,310 500,320 490,340" marker-end="url(#arr)"></path>
            <!-- postgres → Next.js CRM -->
            <path class="edge" d="M460,282 C520,310 680,320 700,340" marker-end="url(#arr)"></path>
            <!-- risk-sandbox ← Next.js CRM (request) -->
            <path class="edge" d="M620,368 L300,368" marker-end="url(#arr)" stroke-dasharray="4 3"></path>
            <text class="edge-label" x="460" y="360">on-demand /execute</text>
          </svg>
        </div>
        <div class="arch-legend">
          <span><span class="swatch ok"></span>healthy</span>
          <span><span class="swatch warn"></span>degraded</span>
          <span><span class="swatch bad"></span>down</span>
          <span><span class="swatch idle"></span>unknown / external</span>
        </div>
      </div>
    </section>
    <section>
      <h2>Containers</h2>
      <div id="containers" class="grid"></div>
    </section>
    <section>
      <h2>Health checks</h2>
      <div id="health" class="health-grid"></div>
    </section>
    <section>
      <h2>Postgres data freshness</h2>
      <table id="freshness">
        <thead><tr><th>Table</th><th class="num">Rows</th><th>Last update</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Intellicar API endpoints</h2>
      <table id="intellicar">
        <thead>
          <tr>
            <th>Endpoint</th>
            <th>Schedule</th>
            <th>Writes to</th>
            <th>Last run (IST)</th>
            <th class="num">Age</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Host</h2>
      <div id="host" class="host-line">—</div>
    </section>
  </main>

<script>
const REFRESH_MS = 5000;

function relUptime(iso) {
  if (!iso || iso.startsWith("0001-")) return "—";
  const start = new Date(iso).getTime();
  if (!start) return "—";
  let s = Math.max(0, Math.floor((Date.now() - start) / 1000));
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600);  s %= 3600;
  const m = Math.floor(s / 60);    s %= 60;
  if (d) return `${d}d${h}h`;
  if (h) return `${h}h${m}m`;
  if (m) return `${m}m${s}s`;
  return `${s}s`;
}

function pillClass(state, restarts) {
  if (state === "running") return restarts > 5 ? "warn" : "ok";
  if (state === "restarting" || state === "created" || state === "paused") return "warn";
  if (state === "missing" || state === "exited" || state === "dead") return "bad";
  return "muted";
}

function renderContainers(list) {
  const el = document.getElementById("containers");
  el.innerHTML = list.map(c => `
    <div class="card">
      <div class="row1">
        <span class="name">${c.name}</span>
        <span class="pill ${pillClass(c.state, c.restart_count)}">${c.state}</span>
      </div>
      <div class="meta">uptime ${relUptime(c.started_at)} · restarts ${c.restart_count} · ${c.status}</div>
      <pre>${(c.logs || "(no logs)").replace(/[<&]/g, m => ({"<":"&lt;","&":"&amp;"}[m]))}</pre>
    </div>
  `).join("");
}

function renderHealth(h) {
  const el = document.getElementById("health");
  const card = (label, res) => `
    <div class="health-card">
      <div class="row1">
        <span class="label">${label}</span>
        <span class="pill ${res.ok ? "ok" : "bad"}">${res.ok ? "ok" : "fail"}</span>
      </div>
      <div class="detail">${(res.detail || "").slice(0, 200)}</div>
    </div>
  `;
  el.innerHTML = card("postgres", h.postgres) + card("redis", h.redis) + card("risk-sandbox", h.risk_sandbox);
}

function renderFreshness(rows) {
  const tbody = document.querySelector("#freshness tbody");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.name}</td>
      <td class="num">${r.rows.toLocaleString()}</td>
      <td class="muted">${r.last || "never"}</td>
    </tr>
  `).join("");
}

function humanAge(sec) {
  if (sec == null) return "—";
  if (sec < 60)    return sec + "s";
  if (sec < 3600)  return Math.floor(sec / 60) + "m";
  if (sec < 86400) return Math.floor(sec / 3600) + "h";
  return Math.floor(sec / 86400) + "d";
}

function staleThresholdSec(schedule) {
  // Returns seconds — beyond this, the row is flagged stale (yellow).
  if (!schedule) return 24 * 3600;
  if (schedule.includes("30s")) return 5 * 60;        // 5 min — generous, poll runs every 30s
  if (schedule.includes("1h"))  return 2 * 3600;      // 2 hours — refresh_roster runs hourly
  if (schedule.includes("daily")) return 26 * 3600;   // 26 hours — daily run + 2h grace
  return 24 * 3600;
}

function renderIntellicar(rows) {
  const tbody = document.querySelector("#intellicar tbody");
  if (!rows || !rows.length) { tbody.innerHTML = ""; return; }
  tbody.innerHTML = rows.map(r => {
    const threshold = staleThresholdSec(r.schedule);
    const isStale = r.age_sec != null && r.age_sec > threshold;
    const cellCls = r.error ? "bad" : (isStale ? "stale" : "muted");
    const tags = (r.tables || []).map(t => `<span class="tag">${t}</span>`).join("");
    const url  = r.url || "";
    return `
      <tr>
        <td><span class="endpoint-name" title="${url}">${r.endpoint}</span></td>
        <td class="muted">${r.schedule || "—"}</td>
        <td>${tags}</td>
        <td class="${cellCls}">${r.last_run_ist || (r.error ? "error: " + r.error.slice(0,60) : "never")}</td>
        <td class="num ${cellCls}">${humanAge(r.age_sec)}</td>
      </tr>`;
  }).join("");
}

function renderHost(h) {
  document.getElementById("host").textContent =
    `${h.hostname} · disk ${h.disk_used_gb}/${h.disk_total_gb} GB (${h.disk_pct}%) · ` +
    `mem ${h.mem_used_mb}/${h.mem_total_mb} MB · load ${h.load.join(" ")}`;
}

function setNodeState(id, state) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("ok", "bad", "warn");
  if (state) el.classList.add(state);
}

function nodeStateForContainer(c) {
  if (!c) return null;
  if (c.state === "running") return c.restart_count > 5 ? "warn" : "ok";
  if (c.state === "restarting" || c.state === "paused") return "warn";
  return "bad";
}

function renderArchitecture(data) {
  // Map service container names to SVG node ids.
  const map = {
    itarang_postgres: "node-postgres",
    itarang_redis: "node-redis",
    itarang_poller: "node-poller",
    itarang_aggregator: "node-aggregator",
    itarang_risk_sandbox: "node-risk_sandbox",
    itarang_monitor: "node-monitor",
  };
  const byName = Object.fromEntries((data.containers || []).map(c => [c.name, c]));

  // Container-derived state (covers poller, aggregator, monitor — no health endpoint).
  for (const [name, id] of Object.entries(map)) {
    setNodeState(id, nodeStateForContainer(byName[name]));
  }

  // Refine postgres / redis / risk-sandbox using their health probes — these
  // are stricter than "container running" (catches "process up but bad creds").
  const h = data.health || {};
  if (h.postgres)     setNodeState("node-postgres",     h.postgres.ok ? "ok" : "bad");
  if (h.redis)        setNodeState("node-redis",        h.redis.ok ? "ok" : "bad");
  if (h.risk_sandbox) setNodeState("node-risk_sandbox", h.risk_sandbox.ok ? "ok" : "bad");

  // Monitor itself: if this JS is running and the fetch succeeded, it's ok.
  setNodeState("node-monitor", "ok");
}

async function tick() {
  const errEl = document.getElementById("err");
  try {
    const r = await fetch("/api/status", { credentials: "same-origin", cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    renderArchitecture(data);
    renderContainers(data.containers);
    renderHealth(data.health);
    renderFreshness(data.freshness);
    renderIntellicar(data.intellicar);
    renderHost(data.host);
    document.getElementById("updated").textContent =
      "updated " + new Date(data.generated_at).toLocaleTimeString();
    errEl.textContent = "";
  } catch (e) {
    errEl.textContent = " · fetch failed: " + e.message;
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>

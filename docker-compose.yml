# ─────────────────────────────────────────────────────────────────────────────
# Itarang IoT Stack — orchestration for the VPS-hosted IoT data plane.
#
# Architecture (see CLAUDE.md / IOT_DEPLOY_README.md):
#   poller       → ingests Intellicar API into Timescale + Redis
#   aggregator   → scheduled Python jobs that join VPS Postgres ↔ AWS RDS,
#                  write pre-computed dashboard_* tables for the CRM to read
#   risk-sandbox → on-demand FastAPI sandbox for LangGraph hypothesis runs
#                  (called from Next.js NBFC routes)
#   postgres     → TimescaleDB; canonical IoT store + dashboard_* tables
#   redis        → poller hot-state cache
#
# The PHP "dashboard" container that used to live here was retired. The IoT
# dashboard is now owned by the Next.js CRM, which reads dashboard_* tables
# via the existing IoT-bridge Drizzle client.
#
# Port map (host-side):
#   5433 → postgres   (127.0.0.1 only — same-host Next.js CRM PM2 service
#                      connects via loopback. No public exposure.)
#   6380 → redis      (127.0.0.1 only)
#   8091 → risk-sandbox (127.0.0.1 only — Next.js calls via SSH tunnel or
#                        internal proxy; never exposed publicly)
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: itarang_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellicar
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: intellicar
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap schemas — Postgres only runs *.sql in this dir on FRESH init.
      # After the volume exists, additive changes go through psql by hand
      # (see IOT_DEPLOY_README.md → "Migration policy").
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./schema/dashboard_aggregates.sql:/docker-entrypoint-initdb.d/02-dashboard-aggs.sql:ro
    ports:
      # Loopback only. The same-host Next.js CRM (PM2 service on this VPS)
      # connects via 127.0.0.1:5433. Other compose services reach this DB
      # over the internal docker network (host `postgres:5432`), not via
      # this host port. If a remote client ever genuinely needs access, do
      # NOT change this binding — front it with Tailscale or an
      # authenticated HTTPS proxy instead.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellicar -d intellicar"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7.4.9-alpine
    container_name: itarang_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  poller:
    build: ./poller
    container_name: itarang_poller
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      INTELLICAR_USERNAME: ${INTELLICAR_USERNAME}
      INTELLICAR_PASSWORD: ${INTELLICAR_PASSWORD}
      PG_DSN:    "postgresql://intellicar:${PG_PASSWORD}@postgres:5432/intellicar"
      REDIS_URL: "redis://redis:6379/0"
      WORKER_ID: "0"
      WORKER_COUNT: "1"
      CONCURRENCY: "50"
      POLL_STATE_SEC: "30"
      ROSTER_REFRESH_SEC: "3600"
      LOG_LEVEL: "INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  aggregator:
    build: ./aggregator
    container_name: itarang_aggregator
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Local Timescale — read raw IoT, write dashboard_*
      IOT_PG_DSN: "postgresql://intellicar:${PG_PASSWORD}@postgres:5432/intellicar"
      # Remote AWS RDS (NBFC loans / borrowers) — READ-ONLY user recommended
      RDS_DSN:    "${NBFC_RDS_DSN_RO}"
      LOG_LEVEL:  "INFO"
      # Job intervals (seconds) — override per environment without rebuilding
      INTERVAL_FLEET_SUMMARY: "60"
      INTERVAL_NBFC_LOAN_IOT: "300"
      INTERVAL_ALERTS_ROLLUP: "300"
      INTERVAL_DPD_RISK_SCORE: "3600"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  monitor:
    build: ./monitor
    container_name: itarang_monitor
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      PG_DSN:           "postgresql://intellicar:${PG_PASSWORD}@postgres:5432/intellicar"
      REDIS_URL:        "redis://redis:6379/0"
      RISK_SANDBOX_URL: "http://risk-sandbox:8000"
      MONITOR_USER:     ${MONITOR_USER}
      MONITOR_PASS:     ${MONITOR_PASS}
    volumes:
      # Read-only docker socket — we only call list/inspect/logs, never run.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Bound to loopback; Caddy on the host fronts the public hostname.
      - "127.0.0.1:8092:8000"
    healthcheck:
      # python:slim has no curl/wget; use stdlib. /healthz is unauthenticated
      # and just confirms the server process is alive.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  risk-sandbox:
    build: ./risk-sandbox
    container_name: itarang_risk_sandbox
    restart: unless-stopped
    # Network and FS hardening — this container runs untrusted-ish Python
    # generated by LangGraph. Lock it down: no outbound network beyond what
    # docker provides for inter-service comms, read-only root FS.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LOG_LEVEL: "INFO"
    ports:
      - "127.0.0.1:8091:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  # Reuses the existing volume created by the previous stack at
  # /opt/intellicar/storage/ (project name was "storage", logical name "pgdata"
  # → docker named it "storage_pgdata"). external:true tells compose NOT to
  # create a new volume on first run — the historical IoT data carries over.
  #
  # Verify on VPS with:  docker volume ls | grep storage_pgdata
  pgdata:
    external: true
    name: storage_pgdata

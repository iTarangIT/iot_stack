name: Deploy IoT Stack to VPS

# ─────────────────────────────────────────────────────────────────────────────
# Deploys the Itarang IoT stack (poller + aggregator + risk-sandbox) to the
# VPS. Everything runs in docker compose; this workflow SSHes in, pulls,
# rebuilds changed images, and recreates only affected containers.
#
# REPO LAYOUT (matches /opt/intellicar/ on the VPS):
#   docker-compose.yml             ← orchestrator (replaces storage/docker-compose.yml)
#   schema.sql                     ← Postgres bootstrap (first-init only)
#   schema/dashboard_aggregates.sql ← dashboard_* tables + agg DDL
#   poller/                        ← Dockerfile + poll.py + requirements.txt
#   aggregator/                    ← Python scheduled jobs (NEW)
#   risk-sandbox/                  ← FastAPI sandbox for LangGraph
#   scripts/                       ← dev tools (fetch_intellicar.py)
#   legacy/                        ← retired PHP dashboard + phase*.sh
#
# VPS LAYOUT:
#   /opt/intellicar/               ← repo clone (APP_DIR)
#   /opt/intellicar/.env           ← written each deploy from IOT_ENV_FILE_B64
#   docker compose v2 + git installed; root is the deploy user.
#
# REQUIRED GITHUB SECRETS:
#   IOT_VPS_HOST            VPS hostname/IP (e.g. 72.61.246.37)
#   IOT_VPS_USER            SSH user (root)
#   IOT_VPS_PORT            SSH port
#   IOT_VPS_SSH_KEY         private key (matches /root/.ssh/authorized_keys)
#   IOT_ENV_FILE_B64        base64 of full .env (PG_PASSWORD, INTELLICAR_*,
#                           NBFC_RDS_DSN_RO)
#   SLACK_WEBHOOK_URL       optional — slack notifications no-op if missing
#
# SCHEMA MIGRATIONS:
#   schema.sql + schema/*.sql are loaded ONLY on first postgres init via
#   /docker-entrypoint-initdb.d/. Changes after first init must be applied
#   manually:
#       docker exec -i itarang_postgres psql -U intellicar -d intellicar < migration.sql
#   The "Detect schema changes" step refuses to deploy if either file changed
#   since the last commit.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-iot-stack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Must exceed the deploy + rollback command_timeouts below (40m + 25m run
    # sequentially in this job). A cold rebuild — base image moved or BuildKit
    # cache evicted — can take ~24m (TimescaleDB re-pull + full pandas/numpy/scipy
    # reinstall), which is what blew past the old 30m cap. See IOT_DEPLOY_README.md.
    timeout-minutes: 55
    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. Slack notify start
      # ──────────────────────────────────────────────────────────────────
      - name: Slack notify start
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=$(printf '%s' "${{ github.event.head_commit.message }}" | head -c 200 | sed 's/"/\\"/g')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":satellite_antenna: *IoT stack deploy started* \`${{ github.sha }}\`\nby ${{ github.actor }} — \`${MSG}\`\n${{ github.event.head_commit.url }}\"}" \
            "$SLACK_WEBHOOK_URL" || true

      # ──────────────────────────────────────────────────────────────────
      # 2. Checkout — needed to detect schema changes
      # ──────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # ──────────────────────────────────────────────────────────────────
      # 3. Migration safety: refuse if schema.sql or schema/*.sql changed.
      #    Apply manually inside the postgres container first, then re-trigger.
      # ──────────────────────────────────────────────────────────────────
      - name: Detect schema changes
        id: schema_check
        run: |
          BASE_SHA=$(git log -2 --format=%H | tail -1)
          CHANGED=$(git diff --name-only "$BASE_SHA"..HEAD -- schema.sql 'schema/*.sql' 'migrations/*.sql' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::Schema files changed since $BASE_SHA:"
            echo "$CHANGED" | sed 's/^/  - /'
            echo "::error::Apply the SQL MANUALLY via 'docker exec -i itarang_postgres psql ...' FIRST, then re-trigger this workflow."
            echo "::error::See IOT_DEPLOY_README.md → 'Migration policy'."
            exit 1
          fi
          echo "No schema changes. Safe to deploy."

      # ──────────────────────────────────────────────────────────────────
      # 4. SSH deploy
      # ──────────────────────────────────────────────────────────────────
      - name: SSH deploy IoT stack
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IOT_VPS_HOST }}
          username: ${{ secrets.IOT_VPS_USER }}
          port: ${{ secrets.IOT_VPS_PORT }}
          key: ${{ secrets.IOT_VPS_SSH_KEY }}
          command_timeout: 40m      # headroom for a one-time cold rebuild (base
                                    # image change / evicted cache ≈ 24m); warm
                                    # deploys still finish in ~1m30s
          script_stop: false        # see deploy-production.yml retro
          script: |
            set -eo pipefail
            exec 2>&1               # surface stderr through drone-ssh
            set -x
            APP_DIR=/opt/intellicar
            cd "$APP_DIR"
            # Phase sentinel: records how far this deploy got. The rollback step
            # only reverts when we reach 'up' (new containers started, then a
            # health check failed) — NEVER on a fetch/build failure or
            # command_timeout, where the previously-running stack is untouched and
            # a destructive git-reset+rebuild would only revert good config.
            echo "start" > /tmp/itarang-iot-deploy-phase
            # Distinct sentinel for the rollback gate. Only a *genuine* health
            # failure (containers up, but a service never went healthy) writes
            # "healthfail" via fail_health(); a fetch/build error or a
            # command_timeout SIGKILL cannot, so the rollback step stays inert.
            echo "running" > /tmp/itarang-iot-deploy-result
            fail_health() { echo "healthfail" > /tmp/itarang-iot-deploy-result; exit 1; }
            # Plain `docker logs` instead of `docker compose logs`: the latter
            # hangs indefinitely on a running container on this host, which is
            # what burned the whole command_timeout in the health-check loops.
            dlogs() { timeout 15 docker logs --tail "$1" "$2" 2>&1 || true; }

            echo "::group::Capture PREV_SHA for rollback"
            PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "$PREV_SHA" > /tmp/itarang-iot-prev-sha
            echo "PREV_SHA=$PREV_SHA"
            echo "::endgroup::"

            echo "::group::Pull latest main"
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            git log -1 --oneline
            echo "pulled" > /tmp/itarang-iot-deploy-phase
            echo "::endgroup::"

            echo "::group::Decide build vs config-only"
            # A config-only change (docker-compose.yml, .env from the secret) needs
            # no image rebuild — `up -d` applies it in seconds. Only rebuild when an
            # app build context actually changed, so config tweaks can't be held
            # hostage by a slow cold rebuild hitting command_timeout.
            CHANGED=$(git diff --name-only "${PREV_SHA}"..HEAD 2>/dev/null || echo "")
            echo "Changed since PREV_SHA:"; echo "$CHANGED"
            if [ -z "$PREV_SHA" ] || echo "$CHANGED" | grep -qE '^(poller|aggregator|risk-sandbox|monitor)/|Dockerfile'; then
              NEED_BUILD=1
            else
              NEED_BUILD=0
            fi
            echo "NEED_BUILD=$NEED_BUILD"
            echo "::endgroup::"

            echo "::group::Write .env from secret"
            umask 077
            echo "${{ secrets.IOT_ENV_FILE_B64 }}" | base64 -d | tr -d '\r' > .env
            chmod 600 .env
            echo "Wrote .env ($(wc -l < .env) lines, $(wc -c < .env) bytes)"
            echo "::endgroup::"

            echo "::group::Verify docker daemon + compose v2"
            docker version --format '{{.Server.Version}}' || { echo "❌ docker daemon not reachable"; exit 1; }
            docker compose version || { echo "❌ docker compose v2 plugin missing"; exit 1; }
            echo "::endgroup::"

            echo "::group::Pull base images (postgres, redis)"
            docker compose pull --ignore-buildable || true
            echo "::endgroup::"

            echo "::group::Build app images (poller + aggregator + risk-sandbox)"
            if [ "$NEED_BUILD" = "1" ]; then
              DOCKER_BUILDKIT=1 docker compose build --pull
            else
              echo "Config-only change — skipping rebuild; existing images reused."
            fi
            echo "built" > /tmp/itarang-iot-deploy-phase
            echo "::endgroup::"

            echo "::group::Recreate changed containers (up -d --remove-orphans)"
            # --remove-orphans drops the retired itarang_dashboard container
            # the first time this runs after the PHP dashboard removal.
            docker compose up -d --remove-orphans
            echo "up" > /tmp/itarang-iot-deploy-phase
            echo "::endgroup::"

            echo "::group::docker compose ps"
            docker compose ps
            echo "::endgroup::"

            # ──────────────────────────────────────────────────────────────
            # Health checks
            # ──────────────────────────────────────────────────────────────
            echo "::group::Health: postgres pg_isready"
            HTTP=fail
            for i in $(seq 1 60); do
              sleep 1
              if docker compose exec -T postgres pg_isready -U intellicar > /dev/null 2>&1; then
                HTTP=ok; echo "postgres healthy after ${i}s"; break
              fi
            done
            if [ "$HTTP" != "ok" ]; then
              echo "❌ postgres pg_isready never returned 0"
              dlogs 80 itarang_postgres
              fail_health
            fi
            echo "::endgroup::"

            echo "::group::Health: redis ping"
            HTTP=fail
            for i in $(seq 1 30); do
              sleep 1
              if docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
                HTTP=ok; echo "redis healthy after ${i}s"; break
              fi
            done
            if [ "$HTTP" != "ok" ]; then
              echo "❌ redis never returned PONG"
              dlogs 80 itarang_redis
              fail_health
            fi
            echo "::endgroup::"

            echo "::group::Health: risk-sandbox 127.0.0.1:8091/health"
            HTTP=000
            for i in $(seq 1 60); do
              sleep 1
              HTTP=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://127.0.0.1:8091/health || echo 000)
              if [ "$HTTP" = "200" ]; then echo "risk-sandbox healthy after ${i}s"; break; fi
            done
            if [ "$HTTP" != "200" ]; then
              echo "❌ risk-sandbox /health returned $HTTP after 60s"
              dlogs 80 itarang_risk_sandbox
              fail_health
            fi
            echo "::endgroup::"

            echo "::group::Health: poller actually polling"
            STATUS=$(docker inspect -f '{{.State.Status}}' itarang_poller 2>/dev/null || echo "missing")
            if [ "$STATUS" != "running" ]; then
              echo "❌ itarang_poller status=$STATUS"
              dlogs 100 itarang_poller
              fail_health
            fi
            # Data-freshness via psql (reliable) instead of log-scraping
            # (docker logs hangs intermittently on this host). vehicle_state.last_seen
            # is bumped every poll cycle; allow ~2min for the first cycle after a
            # poller restart.
            FRESH=999999
            for i in $(seq 1 60); do
              FRESH=$(docker compose exec -T postgres psql -U intellicar -d intellicar -tAc \
                "SELECT COALESCE(EXTRACT(EPOCH FROM now()-max(last_seen))::int, 999999) FROM vehicle_state" \
                2>/dev/null | tr -dc '0-9' || echo 999999)
              if [ "${FRESH:-999999}" -le 180 ] 2>/dev/null; then break; fi
              sleep 2
            done
            if [ "${FRESH:-999999}" -le 180 ] 2>/dev/null; then
              echo "poller fresh: vehicle_state.last_seen ${FRESH}s ago"
            else
              echo "⚠️  poller running but vehicle_state stale (${FRESH}s) — check INTELLICAR_USERNAME/PASSWORD"
              # Non-fatal — credential failures are a separate class.
            fi
            echo "::endgroup::"

            echo "::group::Health: aggregator scheduler started + first job fired"
            STATUS=$(docker inspect -f '{{.State.Status}}' itarang_aggregator 2>/dev/null || echo "missing")
            if [ "$STATUS" != "running" ]; then
              echo "❌ itarang_aggregator status=$STATUS"
              dlogs 120 itarang_aggregator
              fail_health
            fi
            # Verify the aggregator is producing runs via the DB (aggregator_runs),
            # not via logs. Non-fatal: job cadence varies and a deploy can land
            # between jobs, so the container-status check above is the hard gate;
            # the monitor service/Grafana track ongoing freshness.
            RECENT_RUNS=0
            for i in $(seq 1 20); do
              RECENT_RUNS=$(docker compose exec -T postgres psql -U intellicar -d intellicar -tAc \
                "SELECT count(*) FROM aggregator_runs WHERE started_at > now() - interval '15 minutes'" \
                2>/dev/null | tr -dc '0-9' || echo 0)
              if [ "${RECENT_RUNS:-0}" -ge 1 ] 2>/dev/null; then break; fi
              sleep 3
            done
            if [ "${RECENT_RUNS:-0}" -ge 1 ] 2>/dev/null; then
              echo "aggregator healthy: ${RECENT_RUNS} run(s) in last 15min"
            else
              echo "⚠️  no aggregator_runs in last 15min — may be normal between jobs; check monitor/Grafana"
              # Non-fatal — job cadence varies; container-status check above is the gate.
            fi
            echo "::endgroup::"

            echo "::group::Disk + image hygiene"
            docker image prune -f --filter "until=168h" || true
            df -h | head -5
            echo "::endgroup::"

            echo "✅ IoT stack deploy complete: $(git rev-parse --short HEAD)"

      # ──────────────────────────────────────────────────────────────────
      # 5. Rollback on failure
      # ──────────────────────────────────────────────────────────────────
      - name: SSH rollback (only on deploy failure)
        if: failure() && steps.ssh_deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IOT_VPS_HOST }}
          username: ${{ secrets.IOT_VPS_USER }}
          port: ${{ secrets.IOT_VPS_PORT }}
          key: ${{ secrets.IOT_VPS_SSH_KEY }}
          command_timeout: 25m      # rollback rebuild may also be cold
          script_stop: false
          script: |
            set -eo pipefail
            exec 2>&1
            APP_DIR=/opt/intellicar
            cd "$APP_DIR"
            # Only roll back on a CONFIRMED health failure — i.e. the deploy
            # brought the new containers up and a service never went healthy, so
            # fail_health() wrote "healthfail". A fetch/build error or a
            # command_timeout SIGKILL cannot write that sentinel, so we skip the
            # destructive git-reset+rebuild there: the previously-running stack is
            # untouched and reverting would only discard good committed config
            # (this exact misfire spiked the box for a day, twice).
            RESULT=$(cat /tmp/itarang-iot-deploy-result 2>/dev/null || echo "")
            if [ "$RESULT" != "healthfail" ]; then
              echo "No confirmed health failure (result='$RESULT') — most likely a build error"
              echo "or a command_timeout. The live stack is untouched; skipping rollback."
              echo "Investigate and re-run once the cause is fixed."
              exit 0
            fi
            PREV_SHA=$(cat /tmp/itarang-iot-prev-sha 2>/dev/null || echo "")
            CURRENT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "$CURRENT_SHA" ]; then
              echo "No rollback needed (PREV_SHA missing or already at PREV_SHA)"
              exit 0
            fi
            echo "Rolling back IoT stack to $PREV_SHA"
            git reset --hard "$PREV_SHA"
            if [ -f .env ]; then sed -i 's/\r$//' .env; fi
            DOCKER_BUILDKIT=1 docker compose build --pull
            docker compose up -d --remove-orphans
            echo "✅ Rolled back IoT stack to $PREV_SHA"

      # ──────────────────────────────────────────────────────────────────
      # 6. Slack notify result
      # ──────────────────────────────────────────────────────────────────
      - name: Slack notify result
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.ssh_deploy.outcome }}" = "success" ]; then
            ICON=":white_check_mark:"
            STATUS="*succeeded*"
          else
            ICON=":x:"
            STATUS="*FAILED* — rollback ${{ job.status }}"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"${ICON} IoT stack deploy ${STATUS} \`${{ github.sha }}\`\nLogs: ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" || true
